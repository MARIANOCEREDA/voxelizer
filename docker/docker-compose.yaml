services:
  ros-jazzy-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${USERID:-1000}
        GID: ${GROUPID:-1000}

    image: ros-${ROSDISTRO:-jazzy}-dev
    hostname: ros-${ROSDISTRO:-jazzy}-dev
    platform: "linux/amd64"
    container_name: voxelizer_visualizer_cpp
    network_mode: "host"
    privileged: true
    tty: true
    user: ${USERID:-1001}:${GROUPID:-1001}
    stdin_open: true
    environment:
      - DISPLAY
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=0
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=all
      - USERID=${USERID:-1000}
      - GROUPID=${GROUPID:-1000}
    cap_add:
      - SYS_NICE
    group_add:
      - "dialout"
      - "video"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]